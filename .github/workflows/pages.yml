name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      # postinstall extracts the release archive and generates geographic data.
      - name: Download comparison data
        run: node scripts/comparison-release.mjs download --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - name: Export graphs from cached comparisons (offline)
        run: npm run compare -- --export-only --mode continue
      - run: npm run typecheck
      - name: Build production site
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Test the compiled production modules without pretest emitting dev maps.
      - name: Test
        run: node --import tsx --test tests/*.test.ts web/tests/*.test.mjs
      - name: Verify production compiler outputs
        run: |
          if find web/dist -type f \( -name '*.map' -o -name '*.ts' \) -print -quit | grep -q .; then
            echo 'Production output contains source maps or TypeScript files.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
